name: Refresh XE snapshot

# XE 有 AWS WAF，必须用真实 Chrome 读取；每小时刷新以减小当前价的时间差。
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-xe.yml'

permissions:
  contents: write

concurrency:
  group: refresh-xe
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core

      - name: Refresh XE snapshot
        run: node scripts/refresh-data.mjs --only=xe

      - name: Commit if changed
        run: |
          git config user.name "Quest123666"
          git config user.email "opencrty123@proton.me"
          if [ -z "$(git status --porcelain public/data/xe-snapshot.json)" ]; then
            echo "No XE changes"
            exit 0
          fi
          git add public/data/xe-snapshot.json
          git commit -m "chore: refresh XE snapshot"
          git push || {
            git pull --rebase origin main
            git push
          }
