name: Refresh data snapshots

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh snapshots
        run: node scripts/refresh-data.mjs

      - name: Commit if changed
        run: |
          git config user.name "Quest123666"
          git config user.email "opencrty123@proton.me"
          if [ -z "$(git status --porcelain public/data)" ]; then
            echo "No snapshot changes"
            exit 0
          fi
          git add public/data
          git commit -m "chore: refresh data snapshots"
          git push
